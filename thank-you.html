<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Thank You | R&R Consulting</title>

  <meta
    name="description"
    content="Thank you for contacting R&R Consulting."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f7f7;
      color: #222;
      padding: 24px;
    }

    .thank-you {
      width: 100%;
      max-width: 650px;
      text-align: center;
      background: white;
      padding: 60px 40px;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
    }

    .check {
      width: 70px;
      height: 70px;
      margin: 0 auto 25px;
      border-radius: 50%;
      background: #111;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 2.2rem;
    }

    p {
      line-height: 1.7;
      color: #666;
      margin: 10px 0;
    }

    .button {
      display: inline-block;
      margin-top: 28px;
      padding: 13px 24px;
      background: #111;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
    }

    .button:hover {
      opacity: 0.85;
    }
  </style>
</head>

<body>

  <main class="thank-you">

    <div class="check">✓</div>

    <h1>Thank you for contacting us!</h1>

    <p>
      We've received your message and appreciate you reaching out to
      R&R Consulting.
    </p>

    <p>
      We'll review your inquiry and get back to you within 24 hours.
    </p>

    <a href="/" class="button">
      Back to R&R Consulting
    </a>

  </main>

</body>
</html>
